# The checks a change has to pass before it reaches main.
#
# This package is not an application: it is loaded into FaPost Core. So its tests
# run inside a checkout of Core, against the real application, and the last step
# proves the other half of the contract: Core still boots once the package is gone.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  # The same set Core's CI installs (see its .github/workflows/ci.yml).
  PHP_EXTENSIONS: pdo_pgsql, pdo_sqlite, intl, bcmath, zip, gd, pcntl, sockets, redis

jobs:
  # The latest stable Core release, as a tag (v0.4.0). `releases/latest` skips
  # drafts and pre-releases. The package is checked against two Cores: the
  # development line (main) and the last one an operator can actually run.
  core-release:
    name: Latest Core release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      refs: ${{ steps.latest.outputs.refs }}
      has_token: ${{ steps.auth.outputs.present }}

    steps:
      # Fork pull requests never get secrets. Without the token Core cannot be checked out:
      # the package job says so and is skipped (a maintainer checks such a pull request) instead of failing.
      - name: Check for the Core read token
        id: auth
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if [ -n "$CORE_READ_TOKEN" ]; then
              echo "present=true" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::CORE_READ_TOKEN is not available (a fork pull request?): the package job is skipped."
              echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - id: latest
        if: steps.auth.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          tag="$(gh api repos/fapost-lab/core/releases/latest --jq .tag_name)"
          test -n "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "refs=[\"main\",\"${tag}\"]" >> "$GITHUB_OUTPUT"

  package:
    name: Package (Core ${{ matrix.core_ref }})
    needs: core-release
    if: needs.core-release.outputs.has_token == 'true'
    runs-on: ubuntu-latest

    strategy:
      # One Core failing must not hide the result against the other.
      fail-fast: false
      matrix:
        core_ref: ${{ fromJSON(needs.core-release.outputs.refs) }}

    steps:
      # Core is the host application; the package has nothing to boot without it.
      # It is checked out at `main` and at the latest release (the matrix).
      # The repository is private until Core's first stable version, and the
      # GITHUB_TOKEN of this repository cannot read another one, hence a token
      # of its own (fine-grained, read-only on fapost-lab/core). It goes away
      # when Core becomes public.
      - name: Check out Core
        uses: actions/checkout@v7
        with:
          repository: fapost-lab/core
          ref: ${{ matrix.core_ref }}
          token: ${{ secrets.CORE_READ_TOKEN }}
          # The token is needed for this checkout only; do not leave it in
          # .git/config next to Composer plugins.
          persist-credentials: false
          path: core

      # Under Core's packages/ directory, where the overlay and Core's tooling
      # expect a package checkout to be.
      - name: Check out the package
        uses: actions/checkout@v7
        with:
          path: core/packages/solution-hello-world

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.core_ref }}-${{ hashFiles('core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Core's composer.json cannot name this package, so it is added on top
      # of Core's locked versions with the composer overlay: the same mechanism
      # local development uses.
      - name: Describe the overlay
        working-directory: core
        run: |
          cat > composer.overlay.json <<'JSON'
          {
            "repositories": [{ "type": "path", "url": "packages/solution-hello-world" }],
            "require": { "fapost/solution-hello-world": "@dev" }
          }
          JSON

      - name: Install Core with the package
        working-directory: core
        # fapost/foundation and fapost/support are public, but they are `vcs`
        # repositories: Composer reads them through the GitHub API and their
        # zipballs come from api.github.com. Unauthenticated that is 60 calls
        # an hour per IP, and past it Composer falls back to `git clone` over
        # SSH and fails with a misleading "Permission denied (publickey)".
        # The token every run gets automatically lifts the limit.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        # The script is run directly: through `composer
        # overlay`, --no-scripts would disable the overlay script itself. Core's
        # post-update scripts are skipped because they run development tooling
        # (boost:update, ide-helper) a CI checkout has no use for; package
        # discovery runs below through post-autoload-dump.
        # --require-overlay: a lost overlay file must fail the job, not pass as a
        # Core-only install.
        run: php tools/composer-overlay.php --require-overlay -- --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        working-directory: core
        # Composer commands after the overlay read the overlaid manifest.
        env:
          COMPOSER: composer.local.json
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          composer run-script post-autoload-dump --no-interaction

      - name: Validate composer.json
        working-directory: core/packages/solution-hello-world
        run: composer validate --strict

      - name: Code style
        working-directory: core/packages/solution-hello-world
        # Core's Pint, with the package's own pint.json. --test reports without
        # changing anything.
        run: ../../vendor/bin/pint --test --config pint.json src tests lang

      - name: Tests
        working-directory: core/packages/solution-hello-world
        # Inside Core's application: tests/bootstrap.php loads Core's autoloader.
        run: php ../../vendor/bin/phpunit -c phpunit.xml

      # Core works with and without this package and never checks whether it is
      # installed. Dropping the overlay must leave a Core that still boots — the
      # same move a developer makes with a plain `composer install`.
      - name: Core without the package
        working-directory: core
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          composer run-script post-autoload-dump --no-interaction
          php artisan about --only=environment
          test ! -e vendor/composer/installed.json || ! grep -q '"name": "fapost/solution-hello-world"' vendor/composer/installed.json

  # The console bundle in dist/ is committed, because Core has no Node. Rebuilding it from the
  # sources must give the same files, or the committed bundle is stale.
  ui:
    name: UI bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: dist/ matches the sources
        run: |
          git add --intent-to-add dist
          git diff --exit-code dist/
